name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; keep main runs intact.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Draft PRs skip CI until they are marked ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect code changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qvE '^(documentation/|openspec/|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip heavy checks for docs-only changes
        if: steps.changes.outputs.code == 'false'
        run: echo "Docs-only change detected; lint, tests, and build are skipped."

      - name: Use Node.js from .nvmrc
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint

      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: npm run test:run

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: npm run build
